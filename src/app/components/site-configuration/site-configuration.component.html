<app-breadcrumb [pageName]="'Site Configuration'" [icon]="'gears'" />
@if(isDataLoaded){
    <div class="page-table-ttl">Jewellery identity</div>
    <div class="page-table-main">
        <div class="row m-0 p-0">
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Site name</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.siteName" placeholder="Alpha Jewel" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Tagline</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.tagline" />
                </div>
            </div>
            <div class="col-lg-4 col-12 mb-3">
                <label class="form-label">Logo</label>
                <div class="d-flex align-items-center gap-2">
                    <img *ngIf="siteConfig.logo" [src]="siteConfig.logo" alt="" style="height:46px;object-fit:contain;background:#faf7f2;padding:4px" />
                    <button type="button" class="site-btn" (click)="pickImage('logo')">Upload</button>
                </div>
            </div>
            <div class="col-lg-4 col-12 mb-3">
                <label class="form-label">White logo</label>
                <div class="d-flex align-items-center gap-2">
                    <img *ngIf="siteConfig.whiteLogo" [src]="siteConfig.whiteLogo" alt="" style="height:46px;object-fit:contain;background:#1c1410;padding:4px" />
                    <button type="button" class="site-btn" (click)="pickImage('whiteLogo')">Upload</button>
                </div>
            </div>
            <div class="col-lg-4 col-12 mb-3">
                <label class="form-label">Favicon</label>
                <div class="d-flex align-items-center gap-2">
                    <img *ngIf="siteConfig.icon" [src]="siteConfig.icon" alt="" style="height:32px;width:32px;object-fit:contain" />
                    <button type="button" class="site-btn" (click)="pickImage('icon')">Upload</button>
                </div>
            </div>
        </div>
    </div>

    <div class="page-table-ttl">Colour theme</div>
    <div class="page-table-main">
        <div class="row m-0 p-0">
            <div class="col-lg-4 col-12 mb-2" *ngFor="let color of [
                { key: 'primaryColor', label: 'Primary' },
                { key: 'secondaryColor', label: 'Secondary' },
                { key: 'accentColor', label: 'Gold accent' },
                { key: 'backgroundColor', label: 'Page background' },
                { key: 'headingColor', label: 'Heading' },
                { key: 'textColor', label: 'Body text' }
            ]">
                <div class="form-inp-main">
                    <label class="form-label">{{ color.label }}</label>
                    <div class="d-flex align-items-center gap-2">
                        <input type="color" class="form-control form-control-color" [(ngModel)]="siteConfig[color.key]" style="width:50px;height:38px;padding:2px;" />
                        <input class="form-control" type="text" [(ngModel)]="siteConfig[color.key]" />
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Heading font</label>
                    <select class="form-control" [(ngModel)]="siteConfig.headingFont">
                        <option *ngFor="let font of headingFonts" [value]="font">{{ font }}</option>
                    </select>
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Body font</label>
                    <select class="form-control" [(ngModel)]="siteConfig.bodyFont">
                        <option *ngFor="let font of bodyFonts" [value]="font">{{ font }}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="page-table-ttl">Announcement bar</div>
    <div class="page-table-main">
        <div class="row m-0 p-0 align-items-end" *ngFor="let item of siteConfig.marqueeItems; let i = index">
            <div class="col-lg-2 col-4 mb-2">
                <input class="form-control" [(ngModel)]="item.emoji" placeholder="✦" />
            </div>
            <div class="col-lg-8 col-8 mb-2">
                <input class="form-control" [(ngModel)]="item.text" placeholder="Announcement" />
            </div>
            <div class="col-lg-2 col-12 mb-2">
                <button type="button" class="site-btn" (click)="removeMarquee(i)">Remove</button>
            </div>
        </div>
        <button type="button" class="site-btn" (click)="addMarquee()">Add line</button>
    </div>

    <div class="page-table-ttl">Store & checkout</div>
    <div class="page-table-main">
        <div class="row m-0 p-0">
            <div class="col-lg-4 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Currency</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.currency" maxlength="5" />
                </div>
            </div>
            <div class="col-lg-4 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Delivery charge</label>
                    <input class="form-control" type="number" min="0" [(ngModel)]="siteConfig.deliveryCharge" />
                </div>
            </div>
            <div class="col-lg-4 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Mobile</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.mobile" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.email" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Website URL</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.clientUrl" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Buy now text</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.buyNowText" maxlength="50" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Buy now subtext</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.buyNowSubtext" maxlength="100" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Instagram</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.instagramURL" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Facebook</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.facebookURL" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">YouTube</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.youtubeURL" />
                </div>
            </div>
            <div class="col-lg-6 col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Meta Pixel ID</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.metaPixelId" />
                </div>
            </div>
            <div class="col-12 mb-2">
                <div class="form-inp-main">
                    <label class="form-label">Meta conversions token</label>
                    <input class="form-control" type="text" [(ngModel)]="siteConfig.metaAccessToken" />
                </div>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-end mt-2">
        <button type="button" class="site-btn primary-color ms-1" (click)="updateSiteConfig()">Update</button>
    </div>
} @else {
    <app-box-view-skeleton></app-box-view-skeleton>
    <app-box-view-skeleton></app-box-view-skeleton>
}
